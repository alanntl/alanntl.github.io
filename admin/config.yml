# Sveltia CMS content model for alanntl.github.io
# One page per file: each site section is its own editor page, one save is
# one commit. The site fetches these JSONs at load; /?preview polls the raw
# repo copies so a save shows up in seconds, before Pages even builds.

backend:
  name: github
  repo: alanntl/alanntl.github.io
  branch: alanntl
  # The same auth worker the other sites use. If "Sign In with GitHub"
  # refuses this origin, add https://alanntl.github.io to the worker's
  # ALLOWED_ORIGINS in Cloudflare — or use the access-token button.
  base_url: https://sveltia-cms-auth.marvi-groundwater.workers.dev

site_url: https://alanntl.github.io
# The editor's "Live Site" button opens the instant preview — the exact
# page, effects and all, re-rendering seconds after every save.
display_url: "https://alanntl.github.io/?preview"
media_folder: assets
public_folder: assets

editor:
  preview: true

collections:
  - name: pages
    label: Site pages
    editor:
      preview: true
    files:
      - name: structure
        label: "Structure — sections & headline"
        file: content/structure.json
        fields:
          - name: sections
            label: Sections
            label_singular: Section
            widget: list
            summary: "{{fields.label}}{{fields.hidden | ternary(' (hidden)','')}}"
            hint: >-
              Rename, reorder or hide the site's sections. Order here is the
              order in the nav and on the hydrograph. Sections are panels
              that exist in the site's code — you can't create a brand-new
              one from here.
            fields:
              - name: id
                label: Panel
                widget: select
                options: [home, work, projects, writing, research, contact]
              - {name: label, label: Shown label, widget: string}
              - {name: hidden, label: Hidden, widget: boolean, required: false, default: false}
          - name: headline
            label: Headline
            widget: object
            hint: The three stacked lines of the big headline on Home.
            fields:
              - {name: line1, label: Line 1, widget: string}
              - {name: line2, label: Line 2, widget: string}
              - {name: line3, label: "Line 3 (accent colour)", widget: string}

      - name: home
        label: Home
        file: content/home.json
        fields:
          - name: heroLede
            label: Hero paragraph
            widget: text
            hint: The paragraph under the big headline.

      - name: projects
        label: Projects
        file: content/projects.json
        fields:
          - name: items
            label: Projects
            label_singular: Project
            widget: list
            summary: "{{fields.name}} ({{fields.status}})"
            fields:
              - {name: name, label: Name, widget: string}
              - {name: year, label: Year, widget: string}
              - {name: status, label: Status, widget: string, hint: "live and current get the accent chip"}
              - {name: blurb, label: Blurb, widget: text}
              - name: tags
                label: Tags
                widget: list
                required: false
                default: []
                field: {name: tag, label: Tag, widget: string}
              - name: links
                label: Links
                widget: list
                required: false
                default: []
                summary: "{{fields.label}}"
                hint: The first link becomes the title link.
                fields:
                  - {name: label, label: Label, widget: string}
                  - {name: href, label: URL, widget: string}
              - &blocksField
                name: blocks
                label: Blocks
                label_singular: block
                widget: list
                required: false
                default: []
                typeKey: type
                summary: "{{fields.type}}"
                hint: "Optional long-form content under the entry, top to bottom. Add blocks of any type and drag to rearrange."
                types:
                  - label: Text
                    name: text
                    widget: object
                    fields:
                      - {name: heading, label: "Heading (optional)", widget: string, required: false}
                      - {name: body, label: Text, widget: text, hint: "Blank line between paragraphs."}
                  - label: Image
                    name: image
                    widget: object
                    fields:
                      - {name: src, label: Image, widget: image}
                      - {name: alt, label: "Alt text", widget: string}
                      - {name: caption, label: "Caption (optional)", widget: string, required: false}
                  - label: Quote
                    name: quote
                    widget: object
                    fields:
                      - {name: body, label: Quote, widget: text}
                      - {name: attribution, label: "Attribution (optional)", widget: string, required: false}
                  - label: Code
                    name: code
                    widget: object
                    fields:
                      - {name: language, label: "Language label (optional)", widget: string, required: false}
                      - {name: body, label: Code, widget: text}
                  - label: Link button
                    name: link
                    widget: object
                    fields:
                      - {name: label, label: Label, widget: string}
                      - {name: href, label: URL, widget: string}

      - name: writing
        label: Writing
        file: content/writing.json
        fields:
          - name: items
            label: Notes
            label_singular: Note
            widget: list
            required: false
            default: []
            summary: "{{fields.name}}"
            fields:
              - {name: name, label: Title, widget: string}
              - {name: year, label: Year, widget: string}
              - {name: status, label: Status, widget: string}
              - {name: blurb, label: Blurb, widget: text}
              - name: tags
                label: Tags
                widget: list
                required: false
                default: []
                field: {name: tag, label: Tag, widget: string}
              - name: links
                label: Links
                widget: list
                required: false
                default: []
                fields:
                  - {name: label, label: Label, widget: string}
                  - {name: href, label: URL, widget: string}
              - *blocksField

      - name: research
        label: Research
        file: content/research.json
        fields:
          - name: items
            label: Research entries
            label_singular: Entry
            widget: list
            summary: "{{fields.name}}"
            fields:
              - {name: name, label: Name, widget: string}
              - {name: year, label: Year, widget: string}
              - {name: status, label: Status, widget: string}
              - {name: blurb, label: Blurb, widget: text}
              - name: tags
                label: Tags
                widget: list
                required: false
                default: []
                field: {name: tag, label: Tag, widget: string}
              - name: links
                label: Links
                widget: list
                required: false
                default: []
                fields:
                  - {name: label, label: Label, widget: string}
                  - {name: href, label: URL, widget: string}
              - *blocksField

      - name: background
        label: Background
        file: content/background.json
        fields:
          - name: areas
            label: Fields worked in
            label_singular: Field
            widget: list
            summary: "{{fields.field}} — {{fields.when}}"
            fields:
              - {name: field, label: Field, widget: string}
              - {name: when, label: When, widget: string}
              - {name: blurb, label: Blurb, widget: text}
              - {name: current, label: Current, widget: boolean, required: false, default: false}
          - name: rules
            label: Working rules
            label_singular: Rule
            widget: list
            summary: "{{fields.name}}"
            fields:
              - {name: name, label: Rule, widget: string}
              - {name: blurb, label: Blurb, widget: text}

      - name: contact
        label: Contact
        file: content/contact.json
        fields:
          - name: items
            label: Channels
            label_singular: Channel
            widget: list
            summary: "{{fields.label}}"
            fields:
              - {name: label, label: Label, widget: string}
              - {name: detail, label: Shown detail, widget: string}
              - {name: href, label: URL, widget: string}
